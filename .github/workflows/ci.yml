name: SiN CI

on:
  push:
  pull_request:

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Run offline integration campaign
        run: python scripts/run_integration_campaign.py --output integration-campaign.json
      - name: Verify named scenario manifest
        shell: python
        run: |
          import json
          from pathlib import Path
          manifest = json.loads(Path("docs/live-validation-manifest.json").read_text())
          required = ["registration", "control_plane_backlog", "activity_disconnect",
                      "map_contract", "contract_scope", "authority_regression"]
          assert manifest["required_scenarios"] == required
          assert all(Path("integration-campaign.json").read_text().find(secret) < 0
                     for secret in ("campaign-secret", "credential", "pairing_code"))
      - name: Compile Python
        run: python -m compileall -q fs25_network_core tests scripts
      - name: Check patch
        run: git diff --check
      - name: Build release artifacts
        run: python scripts/build_release.py --version ci-${{ github.sha }} --output ci-release
      - name: Verify release artifacts
        shell: python
        run: |
          import hashlib, json
          from pathlib import Path
          from zipfile import ZipFile
          root = Path("ci-release")
          manifest = json.loads((root / "build-manifest.json").read_text())
          assert manifest["release_format_version"] == 1
          for name in ("sin-agent.zip", "FS25_SiN_Server.zip"):
              assert (root / name).is_file()
              actual = hashlib.sha256((root / name).read_bytes()).hexdigest()
              assert actual == manifest["agent_sha256" if name == "sin-agent.zip" else "server_sha256"]
          assert (root / "Update-SiN.ps1").is_file()
          assert hashlib.sha256((root / "Update-SiN.ps1").read_bytes()).hexdigest() == manifest["updater_sha256"]
          assert (root / "Update-SiN-Client.ps1").is_file()
          assert hashlib.sha256((root / "Update-SiN-Client.ps1").read_bytes()).hexdigest() == manifest["client_updater_sha256"]
          assert (root / "integration-campaign.json").is_file()
          assert hashlib.sha256((root / "integration-campaign.json").read_bytes()).hexdigest() == manifest["campaign_report_sha256"]
          assert (root / "live-validation-manifest.json").is_file()
          assert hashlib.sha256((root / "live-validation-manifest.json").read_bytes()).hexdigest() == manifest["live_validation_manifest_sha256"]
          assert len(manifest["required_scenarios"]) == 6
          checksums = (root / "SHA256SUMS.txt").read_text()
          assert "Update-SiN.ps1" in checksums
          assert "Update-SiN-Client.ps1" in checksums
          with ZipFile(root / "sin-agent.zip") as archive:
              assert set(archive.namelist()) == {"fs25_network_core/__init__.py", "fs25_network_core/agent.py"}
          with ZipFile(root / "FS25_SiN_Server.zip") as archive:
              assert {"modDesc.xml", "NetworkLocal.lua"}.issubset(archive.namelist())
