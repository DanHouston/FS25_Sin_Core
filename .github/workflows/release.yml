name: SiN Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Compile Python
        run: python -m compileall -q fs25_network_core tests scripts
      - name: Check patch
        run: git diff --check
      - name: Build release package
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python scripts/build_release.py --version "${{ github.ref_name }}" --output release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release/* --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
